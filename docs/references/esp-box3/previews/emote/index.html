<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOX-3 · Emote 原资源预览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#10151c;color:#e7edf6;font:16px/1.6 -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:1120px;margin:auto;padding:32px 24px}h1{font-size:28px;margin:0 0 8px}p{color:#aab8ca;margin:0 0 18px}button{border:1px solid #44556d;border-radius:9px;padding:8px 16px;background:#1c2939;color:#e7edf6;cursor:pointer}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin-top:22px}figure{margin:0;background:#171f2b;border:1px solid #2b394c;border-radius:12px;overflow:hidden}img{width:100%;aspect-ratio:4/3;object-fit:contain;display:block;background:#000}figcaption{padding:10px 14px}small{float:right;color:#8da0b9;font-size:12px}a{color:#7dd3fc}footer{font-size:13px;color:#aab8ca;margin-top:24px}</style>
<main><h1>Emote 原始动画预览</h1><p>乐鑫维护者发布的 Emote 资源包 · BOX-3 320 × 240 布局 · 原始帧按 20 fps 播放</p><p>这些是当前依赖中的原始 EAF 解码结果；浏览器为方便比较重复播放。预览省略电量、时钟和对白叠层，不是设备实录。</p><button id="toggle" type="button" aria-pressed="false">暂停预览</button><section><figure><img src="Happy.gif" alt="开心 动画"><figcaption>开心 <small>42 帧 · 20 fps</small></figcaption></figure><figure><img src="neutral.gif" alt="待机眼睛 动画"><figcaption>待机眼睛 <small>88 帧 · 20 fps</small></figcaption></figure><figure><img src="winking.gif" alt="眨眼 动画"><figcaption>眨眼 <small>14 帧 · 20 fps</small></figcaption></figure><figure><img src="Sad.gif" alt="难过 动画"><figcaption>难过 <small>96 帧 · 20 fps</small></figcaption></figure><figure><img src="cry.gif" alt="哭泣 动画"><figcaption>哭泣 <small>43 帧 · 20 fps</small></figcaption></figure><figure><img src="angry.gif" alt="生气 动画"><figcaption>生气 <small>50 帧 · 20 fps</small></figcaption></figure><figure><img src="confused.gif" alt="疑惑 动画"><figcaption>疑惑 <small>77 帧 · 20 fps</small></figcaption></figure><figure><img src="shocked.gif" alt="惊讶 动画"><figcaption>惊讶 <small>34 帧 · 20 fps</small></figcaption></figure><figure><img src="sleep.gif" alt="困倦 动画"><figcaption>困倦 <small>118 帧 · 20 fps</small></figcaption></figure><figure><img src="listen.gif" alt="聆听指示 动画"><figcaption>聆听指示 <small>50 帧 · 20 fps</small></figcaption></figure></section><footer>资源：esp_emote_assets 0.1.2 · commit 29aa5259ac22651b8636683698c021482050b206 · <a href="https://github.com/espressif2022/esp_emote_assets">来源仓库</a><br>小智接入了这套组件；它不同于 21 张 Noto PNG，也不是 BOX-3 旧出厂界面动画。部分固件状态只播一次，这里统一循环便于查看。未修改或烧录固件。</footer></main><script>let paused=false;document.querySelector('#toggle').onclick=function(){paused=!paused;document.querySelectorAll('img').forEach(i=>i.src=i.src.replace(paused?'.gif':'.png',paused?'.png':'.gif'));this.textContent=paused?'继续预览':'暂停预览';this.setAttribute('aria-pressed',String(paused));};</script></html>
